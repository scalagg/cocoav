import java.util.stream.Collectors

plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.6.20"
    id "org.jetbrains.kotlin.kapt" version "1.6.20"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

allprojects {
    group "gg.scala.cocoa"
    version "1.1.5"

    repositories {
        mavenCentral()

        maven {
            name "Scala"
            allowInsecureProtocol true
            url "http://repository.scala.gg/repository/maven-releases/"

            credentials {
                username property("scala.credentials.username") as String
                password property("scala.credentials.password") as String
            }
        }

        maven { url "https://repo.stellardrift.ca" }
        maven { url "https://nexus.velocitypowered.com/repository/maven-public/" }
        maven { url "https://jitpack.io" }
    }

    dependencies {
        compileOnly "com.velocitypowered:velocity-api:3.0.1"
        kapt "com.velocitypowered:velocity-api:3.0.1"

        implementation "gg.scala.lemon:common:1.1.1"
        compileOnly "gg.scala.store:velocity:0.1.3"

        implementation "net.evilblock.cubed:velocity:1.3.7"
        implementation "org.jetbrains.kotlin:kotlin-stdlib"

        compileOnly fileTree("lib")

        implementation "com.github.Revxrsal.Lamp:velocity:3.0.2"
        implementation "com.github.Revxrsal.Lamp:common:3.0.2"
        implementation "com.github.Revxrsal.Lamp:ktx:3.0.2"

        implementation "io.lettuce:lettuce-core:6.1.8.RELEASE"
    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "1.8"
    }

    shadowJar {
        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_builtins"
        exclude "META-INF/"

        archiveFileName = "cocoa-velocity.jar"
    }

    tasks.withType(GenerateMavenPom).all {
        doLast {
            final File file = new File(
                    "$buildDir/publications/shadow/pom-default.xml"
            )

            final BufferedReader br = new BufferedReader(
                    new FileReader(file)

            )
            final String lines = br.lines()
                    .map((line) -> {
                        if (line.contains("<dependencies/>")) "" else line
                    })
                    .collect(Collectors.joining("\n"))

            final BufferedWriter wr = new BufferedWriter(
                    new FileWriter(file, true)
            )

            final PrintWriter writer = new PrintWriter(file)
            writer.print("")
            writer.close()

            wr.write(lines)
            wr.close()
        }
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            maven {
                name "Scala"
                allowInsecureProtocol true
                url "http://repository.scala.gg/repository/maven-releases/"

                credentials {
                    username property("scala.credentials.username") as String
                    password property("scala.credentials.password") as String
                }
            }
        }
    }

    tasks.build.dependsOn(shadowJar, publishShadowPublicationToScalaRepository)
}
