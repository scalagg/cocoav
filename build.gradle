plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "org.jetbrains.kotlin.jvm" version "1.7.0"
    id "org.jetbrains.kotlin.kapt" version "1.7.0"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.cocoa"
version "1.1.6"

String environmental(String key)
{
    final String environment =
        System.getenv(key)

    if (environment != null)
    {
        return environment
    }

    return project.property(key)
}

repositories {
    mavenCentral()
    maven {
        name "Scala"
        url "${environmental("artifactory_contextUrl")}/gradle-release"

        credentials {
            username environmental("artifactory_user")
            password environmental("artifactory_password")
        }
    }

    maven { url "https://repo.stellardrift.ca" }
    maven { url "https://nexus.velocitypowered.com/repository/maven-public/" }
    maven { url "https://jitpack.io" }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:3.0.1"
    kapt "com.velocitypowered:velocity-api:3.0.1"

    compileOnly "gg.scala.store:velocity:0.1.3"

    implementation "gg.scala.commons:serializers:2.0.0"
    implementation "gg.scala.commons:store:2.0.0"

    implementation "com.orbitz.consul:consul-client:1.5.3"

    compileOnly fileTree("lib")

    implementation "com.github.Revxrsal.Lamp:velocity:3.0.4"
    implementation "com.github.Revxrsal.Lamp:common:3.0.4"
    implementation "com.github.Revxrsal.Lamp:ktx:3.0.4"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"
    exclude "**/kotlin/"

    archiveFileName = "cocoa-velocity.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "Scala"
            url "${environmental("artifactory_contextUrl")}/gradle-release"

            credentials {
                username environmental("artifactory_user")
                password environmental("artifactory_password")
            }
        }
    }
}

artifactory {
    this.contextUrl = environmental("artifactory_contextUrl")

    publish {
        repository {
            repoKey = environmental("artifactory_release_local")
            username = environmental("artifactory_user")
            password = environmental("artifactory_password")
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
