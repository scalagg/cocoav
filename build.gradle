plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "org.jetbrains.kotlin.jvm" version "2.1.0"
    id "org.jetbrains.kotlin.kapt" version "2.1.0"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.cocoa"
version "1.2.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        name "Scala"
        url "${property("artifactory_contextUrl")}/gradle-release"

        credentials {
            username property("artifactory_user")
            password property("artifactory_password")
        }
    }


    maven {
        setName("elytrium-repo")
        setUrl("https://maven.elytrium.net/repo/")
    }

    maven { url "https://repo.stellardrift.ca" }
    maven { url "https://repo.papermc.io/repository/maven-public/" }
    maven {
        url "https://nexus.velocitypowered.com/repository/maven-public/"
        content {
            includeGroup("com.velocitypowered")
        }
    }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.nickuc.com/maven-releases/" }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:3.1.0"
    kapt "com.velocitypowered:velocity-api:3.1.0"
    compileOnly("net.elytrium.limboapi:api:1.1.25")

    implementation "dev.samstevens.totp:totp:1.7.1"

    compileOnly "gg.scala.store:velocity:0.1.3"
    compileOnly "com.nickuc.login:api:10.4"

    // https://mvnrepository.com/artifact/io.github.resilience4j/resilience4j-circuitbreaker
    implementation("io.github.resilience4j:resilience4j-circuitbreaker:2.2.0")

    implementation "gg.scala.commons:velocity:3.5.2"
    implementation "gg.scala.commons:serversync:3.5.2"
    implementation "gg.scala.lemon:common:1.9.1"

    implementation "ch.qos.logback:logback-classic:1.4.4"
    implementation 'net.kyori:adventure-text-minimessage:4.11.0'

    implementation "com.konghq:unirest-java:3.13.11"
    compileOnly fileTree("lib")
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "17"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"
    exclude "**/kotlin/"

    archiveFileName = "cocoa-velocity.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "Scala"
            url "${property("artifactory_contextUrl")}/gradle-release"

            credentials {
                username property("artifactory_user")
                password property("artifactory_password")
            }
        }
    }
}

artifactory {
    this.contextUrl = property("artifactory_contextUrl")

    publish {
        repository {
            repoKey = property("artifactory_release_local")
            username = property("artifactory_user")
            password = property("artifactory_password")
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
